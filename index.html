<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chord Coach</title>
  <meta name="description" content="See piano chords for both hands, step through song chords, and memorise them with a quiz.">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chords">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="30" height="30">
      <div>
        <h1>Chord Coach</h1>
        <div class="legend-inline"><span class="dot lh"></span>Left hand <span class="dot rh"></span>Right hand</div>
      </div>
    </div>
    <nav id="tabs" class="tabs" aria-label="Sections"></nav>
  </header>
  <main id="main"></main>
  <noscript>Chord Coach needs JavaScript turned on.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
